<svg viewBox="0 0 400 400" width="100%" height="100%">

    .tausta { fill: #0f172a; }
    .sirppi { fill: #f8fafc; }
    .tahti-pisteet { fill: #fdff8f; }
    .paateksti { font-family: sans-serif; font-size: 32px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
  </style>

  <rect class="tausta" width="400" height="400" rx="20" />

  <path class="sirppi" d="M 240,110 A 70,70 0 0,0 240,250 A 90,90 0 0,1 240,110 Z" />

  <g class="tahti-pisteet">
    <circle cx="110" cy="230" r="8" />
    <circle cx="120" cy="170" r="8" />
    <circle cx="150" cy="120" r="8" />
    <circle cx="200" cy="90"  r="8" />
    <circle cx="260" cy="80"  r="8" />

  </g>

  <text class="paateksti" x="200" y="325">KOSMOS</text>
</svg>
